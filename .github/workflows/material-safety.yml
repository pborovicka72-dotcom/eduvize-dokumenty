name: Material deletion safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  document-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install fastapi httpx
      - name: Backend validation and catalog regressions
        run: |
          python -m unittest discover -s tests -p test_document_batch.py -v
          python -m unittest discover -s tests -p test_document_scopes.py -v
          python -m unittest discover -s tests -p test_upload_validation.py -v
          python -m py_compile app.py document_delivery.py
      - name: Deletion confirmation and preview school context
        run: |
          node tests/safe-deletion.test.mjs
          node tests/preview-profile.test.mjs
          node tests/documents-output-bridge.test.cjs
          node tests/documents-saved-workflow.test.cjs
          node tests/documents-published.test.cjs
