services:
  - type: web
    name: eduvize-dokumenty-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://pborovicka72-dotcom.github.io/eduvize-dokumenty/config.html
