services:
  - type: web
    name: eduvize-dokumenty-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DOCUMENTS_ADMIN_TOKEN
        sync: false
      - key: DOCUMENTS_STORAGE_DIR
        value: /var/data/eduvize-documents
    disk:
      name: eduvize-documents-data
      mountPath: /var/data
      sizeGB: 1
