<html data-kiosk-app="documents" lang="cs"><head><script src="https://pborovicka72-dotcom.github.io/eduvize-styly/design-system/output-modes.js?v=20261031-integrity-1"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eduvize – Dokumenty</title><link rel="stylesheet" href="https://pborovicka72-dotcom.github.io/eduvize-styly/design-system/admin-tokens.css?v=20261031-integrity-1"><link rel="stylesheet" href="https://pborovicka72-dotcom.github.io/eduvize-styly/design-system/documents.css?v=20261031-surfaces-1">
<script id="pdf-library" src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script><script>const pdfLibraryReady=new Promise(resolve=>{const script=document.getElementById("pdf-library");script.addEventListener("load",()=>resolve(true),{once:true});script.addEventListener("error",()=>resolve(false),{once:true});});</script><link rel="stylesheet" href="https://pborovicka72-dotcom.github.io/eduvize-styly/design-system/document-viewport.css?v=4"><script src="https://pborovicka72-dotcom.github.io/eduvize-styly/design-system/document-viewport.js?v=4"></script><script defer src="https://pborovicka72-dotcom.github.io/eduvize-styly/design-system/active-theme.js?v=20261031-integrity-1"></script><link rel="stylesheet" href="https://pborovicka72-dotcom.github.io/eduvize-styly/design-system/navigation.css?v=1"><link rel="stylesheet" href="https://pborovicka72-dotcom.github.io/eduvize-styly/design-system/app-icons.css?v=1"><script defer src="https://pborovicka72-dotcom.github.io/eduvize-styly/design-system/app-icons.js?v=2"></script><link rel="stylesheet" href="https://pborovicka72-dotcom.github.io/eduvize-styly/design-system/output-header.css?v=20261031-integrity-1"><script src="https://pborovicka72-dotcom.github.io/eduvize-styly/design-system/segment-profile.js?v=20261031-integrity-1"></script><script src="https://pborovicka72-dotcom.github.io/eduvize-styly/design-system/output-header.js?v=20261031-integrity-1"></script><link rel="stylesheet" href="https://pborovicka72-dotcom.github.io/eduvize-styly/design-system/kiosk-output.css?v=20261031-surfaces-1"><script defer src="https://pborovicka72-dotcom.github.io/eduvize-styly/design-system/kiosk-output.js?v=20261031-integrity-1"></script><link rel="stylesheet" href="https://pborovicka72-dotcom.github.io/eduvize-styly/design-system/output-integrity.css?v=20261031-document-flow-1"><script defer src="https://pborovicka72-dotcom.github.io/eduvize-styly/design-system/web-brand.js?v=20261031-integrity-1"></script><script defer src="https://pborovicka72-dotcom.github.io/eduvize-styly/design-system/output-integrity.js?v=20261031-document-flow-1"></script><script src="https://pborovicka72-dotcom.github.io/eduvize-styly/design-system/nsp-geometry.js?v=1"></script><link rel="icon" type="image/svg+xml" href="https://pborovicka72-dotcom.github.io/eduvize-styly/design-system/assets/eduvize-favicon.svg?v=1"></head><body><main class="shell"><div id="documentLoading" role="status" aria-live="polite">Načítám dokument…</div><nav id="documentNavigation" class="edu-navigation edu-output-header" aria-label="Navigace dokumentů"><div class="edu-navigation-heading edu-navigation__heading edu-app-heading edu-header-group"><span data-edu-app-icon="documents"></span><div><h1 id="heading-title" class="edu-navigation-title edu-header-title">Dokumenty školy</h1><p id="heading-count" class="edu-navigation-subtitle edu-header-meta"></p></div></div><div class="edu-navigation__actions"><button id="back" type="button" class="edu-navigation-button" hidden><span aria-hidden="true">←</span>Zpět</button><button id="documentsHome" type="button" class="edu-navigation-button" hidden><span aria-hidden="true">⌂</span>Kategorie</button></div></nav><section class="card">

<div id="browse"></div>
<div id="detail" class="hidden edu-document-fullscreen"><div id="viewer-title" hidden></div><div id="pdfTools"></div><div class="viewer" id="viewer"></div><div class="controls" id="controls"><button class="edu-document-tool" id="prev">← Předchozí</button><button class="edu-document-tool" id="next">Další →</button><button class="edu-document-tool hidden" id="returnCatalog">Zpět na dokumenty</button><button class="edu-document-tool hidden" id="pdfOverview">Přehled stránek</button><span class="edu-document-zoom" id="pdfPosition" role="status" aria-live="polite"></span></div></div>
</section></main>
<script>
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);
const signage=params.get('layout')==='signage',kiosk=params.get('viewMode')==='kiosk'||params.get('output')==='kiosk';
const webOutput=window.EduvizeOutputModes.mode()==='web';const standaloneDocument=!!params.get('document');let directDocument=standaloneDocument&&!webOutput;if(directDocument)document.documentElement.classList.add('document-output');
if(signage)document.body.classList.add('signage');if(kiosk)document.documentElement.classList.add('kiosk-output');
const videoSound=params.get('video_sound')==='on';let pdfColumns=directDocument?1:Math.max(1,Math.min(6,parseInt(params.get('pdf_columns')||'1',10)||1));
let docs=[],category=null,selected=null,index=0,pdfPage=0,pdfTotal=0,pdfGrid=null,pdfFile=null,pdfZoomed=false,pdfOverviewColumns=1,pdfOverviewSample=[],imageView=null,screen='folders';
const pdfViewport=window.EduvizeDocumentViewport.mount($('pdfTools'),{onChange:()=>{if(pdfGrid&&pdfFile)redrawPdf();},fullscreenTarget:$('detail')});
const categoryOf=d=>d.category||'Ostatní';const displayTitle=d=>d.title?.trim()||d.name;
const fileUrl=d=>'/api/documents/'+encodeURIComponent(d.id)+'/file';
const folderIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
function documentReady(){if(directDocument)document.documentElement.classList.add('document-ready');}
function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function setHeading(title,count){$('heading-title').textContent=title;$('heading-count').textContent=count;$('heading-count').hidden=!count;$('documentNavigation').hidden=standaloneDocument&&!webOutput;$('back').hidden=screen==='folders';$('documentsHome').hidden=screen==='folders';}
function categoryDocs(){return category===null?docs:docs.filter(d=>categoryOf(d)===category)}
function leaveDocument(){imageView?.destroy();imageView=null;if(standaloneDocument)return;directDocument=false;document.documentElement.classList.remove('document-output','document-ready');pdfViewport.activate(false);pdfRenderId++;}
function showFolders(){stopPdfPreviews();leaveDocument();screen='folders';category=null;selected=null;$('detail').classList.add('hidden');$('browse').classList.remove('hidden');$('browse').replaceChildren();const cats=[...new Set(docs.map(categoryOf))];setHeading('Kategorie dokumentů',cats.length+' kategorií');if(!cats.length){$('browse').append(node('div','empty','Zatím nejsou zveřejněné žádné dokumenty.'));return}const grid=node('div','grid');for(const name of cats){const count=docs.filter(d=>categoryOf(d)===name).length;const b=node('button','tile folder-tile');b.type='button';const icon=node('span','folder-icon');icon.innerHTML=folderIcon;const title=node('div','tile-title',name);const foot=node('div','tile-foot');foot.append(node('span','',count+' '+(count===1?'dokument':count<5?'dokumenty':'dokumentů')),node('span','arrow','→'));b.append(icon,title,foot);b.onclick=()=>showCategory(name);grid.append(b)}$('browse').append(grid)}
const previewCache=new Map();
function loadPdf(doc){
 let pending=previewCache.get(doc.id);if(pending)return pending;
 pending=(async()=>{
  if(!window.pdfjsLib)await pdfLibraryReady;
  if(!window.pdfjsLib)throw Error('Knihovna PDF.js není dostupná');
  window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const response=await fetch(fileUrl(doc));if(!response.ok)throw Error('HTTP '+response.status);
  return await window.pdfjsLib.getDocument({data:await response.arrayBuffer()}).promise;
 })();previewCache.set(doc.id,pending);pending.catch(()=>{if(previewCache.get(doc.id)===pending)previewCache.delete(doc.id);});return pending;
}
let pendingPreviews=[],activePreviews=0;
function pumpPreviews(){
 while(activePreviews<1&&pendingPreviews.length){const job=pendingPreviews.shift();if(!job.container.isConnected||screen!=='category')continue;activePreviews++;renderPdfPreview(job.doc,job.container).finally(()=>{activePreviews--;pumpPreviews();});}
}
const previewJobs=new WeakMap(),previewObserver=typeof IntersectionObserver==='function'?new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting){const job=previewJobs.get(entry.target);previewObserver.unobserve(entry.target);if(job){pendingPreviews.push(job);previewJobs.delete(entry.target);}}pumpPreviews();},{rootMargin:'150px'}):null;
function schedulePdfPreview(doc,container){const job={doc,container};if(previewObserver){previewJobs.set(container,job);previewObserver.observe(container);}else{pendingPreviews.push(job);queueMicrotask(pumpPreviews);}}
function stopPdfPreviews(){pendingPreviews=[];previewObserver?.disconnect();}
async function renderPdfPreview(doc,container){
 const fallback=()=>{container.replaceChildren();const box=node('div','preview-fallback');box.append(node('span','pdf-icon','PDF'),node('span','','Náhled není dostupný'));container.append(box)};
 try{
  const documentPdf=await loadPdf(doc);const page=await documentPdf.getPage(1);const base=page.getViewport({scale:1});
  const scale=Math.min(420/base.width,300/base.height,2);const viewport=page.getViewport({scale});
  const canvas=document.createElement('canvas');canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);
  const ctx=canvas.getContext('2d');await page.render({canvasContext:ctx,viewport}).promise;
  if(container.isConnected)container.replaceChildren(canvas);
 }catch(e){if(container.isConnected)fallback()}
}
function thumbnail(doc){const t=node('div','thumb');if(doc.mime&&doc.mime.startsWith('image/')){const img=node('img');img.loading='lazy';img.alt='Náhled: '+doc.name;img.src=fileUrl(doc);img.onerror=()=>{t.replaceChildren(node('span','pdf-icon','OBR'))};t.append(img)}else if(doc.mime==='application/pdf'){t.append(node('span','pdf-icon','PDF'));schedulePdfPreview(doc,t)}else if(doc.mime?.startsWith('video/')){t.append(node('span','pdf-icon','▶ VIDEO'))}else if(doc.mime?.includes('wordprocessingml')){t.append(node('span','pdf-icon','WORD'))}else if(doc.mime?.includes('presentationml')){t.append(node('span','pdf-icon','PPTX'))}else{t.append(node('span','pdf-icon','SOUBOR'))}return t}
function showCategory(name){stopPdfPreviews();leaveDocument();screen='category';category=name;selected=null;$('detail').classList.add('hidden');$('browse').classList.remove('hidden');$('browse').replaceChildren();const list=categoryDocs();setHeading(name,list.length+' dokumentů');const grid=node('div','grid');for(const d of list){const b=node('button','tile');b.type='button';b.append(thumbnail(d));const body=node('div','tile-body');body.append(node('div','doc-title',displayTitle(d)),node('div','doc-type',d.mime==='application/pdf'?'PDF dokument':d.mime?.startsWith('video/')?'Video':d.mime?.includes('wordprocessingml')?'Word dokument':d.mime?.includes('presentationml')?'PowerPoint prezentace':'Obrázek'));b.append(body);b.onclick=()=>showDocument(d.id);grid.append(b)}$('browse').append(grid)}
let pdfRenderId=0;
async function showPdfPages(doc,viewer,renderId){
 const grid=node('div','pdf-pages');grid.style.setProperty('--pdf-columns',String(pdfColumns));grid.append(node('div','muted','Načítám stránky PDF…'));viewer.append(grid);
 try{
  const pdf=await loadPdf(doc);
  if(renderId!==pdfRenderId)return;
  grid.replaceChildren();pdfTotal=pdf.numPages;pdfGrid=grid;pdfPage=0;if(directDocument){pdfOverviewColumns=1;pdfColumns=1;pdfZoomed=false;}updatePageButtons();
  const overviewSample=await Promise.all(Array.from({length:Math.min(3,pdf.numPages)},async(_,i)=>(await pdf.getPage(i+1)).getViewport({scale:1})));if(renderId!==pdfRenderId)return;pdfOverviewSample=overviewSample;
  pdfFile=pdf;await renderPdfSheets(pdf,grid,renderId);if(renderId===pdfRenderId)documentReady();

 }catch(e){if(renderId===pdfRenderId){grid.replaceChildren(node('div','pdf-error','Stránky PDF se nepodařilo zobrazit: '+e.message));documentReady();}}
}
async function renderPdfSheets(pdf,grid,renderId){
 if(renderId!==pdfRenderId)return;
 if(directDocument&&!pdfZoomed){
   pdfOverviewColumns=window.EduvizeDocumentViewport.overview(pdfOverviewSample,grid.clientWidth,grid.clientHeight).columns;
   pdfPage=Math.floor(pdfPage/pdfOverviewColumns)*pdfOverviewColumns;
   pdfColumns=Math.min(pdfOverviewColumns,pdf.numPages-pdfPage);updatePageButtons();
 }
 if(directDocument){grid.replaceChildren();grid.style.setProperty('--pdf-columns',String(pdfColumns));grid.classList.add('edu-document-canvas');grid.classList.toggle('is-zoomed',pdfZoomed);pdfViewport.bind(grid);}
  const maxWidth=Math.max(directDocument?1:120,Math.floor((grid.clientWidth-24-(pdfColumns-1)*12)/pdfColumns));
  for(let n=directDocument?pdfPage+1:1;n<=(directDocument?Math.min(pdf.numPages,pdfPage+pdfColumns):pdf.numPages);n++){
   if(renderId!==pdfRenderId)return;
   const page=await pdf.getPage(n),original=page.getViewport({scale:1});if(renderId!==pdfRenderId)return;
   const displayScale=directDocument&&pdfZoomed?pdfViewport.scale(original,Math.max(1,grid.clientWidth-24),Math.max(1,grid.clientHeight-24)):Math.min(maxWidth/original.width,directDocument?Math.max(1,grid.clientHeight-24)/original.height:Infinity);
   const viewport=page.getViewport({scale:Math.min(4,displayScale)});
   const canvas=node('canvas','pdf-page');if(directDocument){canvas.style.width=original.width*displayScale+'px';canvas.style.height=original.height*displayScale+'px';}canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);
   canvas.setAttribute('aria-label','Stránka '+n+' z '+pdf.numPages);canvas.dataset.page=String(n-1);
   if(directDocument&&pdfTotal>0){canvas.setAttribute('role','button');canvas.tabIndex=0;canvas.title=pdfZoomed?'Zpět na přehled':'Zvětšit stránku '+n;canvas.classList.toggle('is-zoomed',pdfZoomed);canvas.onclick=()=>pdfZoomed?pdfViewport.zoomIn():enlargePdfPage(n-1);canvas.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();canvas.onclick();}};}
   grid.append(canvas);
   await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;
   if(directDocument&&renderId===pdfRenderId&&n===pdfPage+1)documentReady();
  }
}
function updatePageButtons(){const pdf=screen==='document'&&categoryDocs().find(d=>d.id===selected)?.mime==='application/pdf';$('prev').disabled=!pdf||pdfPage<=0;$('next').disabled=!pdf||pdfPage+pdfColumns>=pdfTotal;$('controls').classList.toggle('hidden',standaloneDocument&&(!pdf||(directDocument&&!pdfZoomed&&pdfTotal<=1)));$('returnCatalog').classList.add('hidden');$('prev').classList.toggle('hidden',!pdf||pdfTotal<=pdfColumns);$('next').classList.toggle('hidden',!pdf||pdfTotal<=pdfColumns);$('pdfOverview').classList.toggle('hidden',!directDocument||!pdfZoomed);$('pdfPosition').textContent=directDocument&&pdfTotal?(pdfColumns>1?String(pdfPage+1)+'–'+Math.min(pdfTotal,pdfPage+pdfColumns):String(pdfPage+1))+' / '+pdfTotal:'';}
function redrawPdf(){updatePageButtons();const id=++pdfRenderId;renderPdfSheets(pdfFile,pdfGrid,id).then(()=>{if(id===pdfRenderId)documentReady();}).catch(error=>{if(id===pdfRenderId){pdfGrid.replaceChildren(node('div','pdf-error',error.message));documentReady();}});}
function enlargePdfPage(index){pdfPage=index;pdfZoomed=true;pdfColumns=1;pdfViewport.activate(true);redrawPdf();}
function showPdfOverview(){pdfZoomed=false;pdfViewport.activate(false);redrawPdf();}
function movePages(delta){if(!pdfGrid||!pdfTotal)return;const step=directDocument&&!pdfZoomed?pdfOverviewColumns:pdfColumns;const lastStart=directDocument?Math.floor((pdfTotal-1)/step)*step:Math.max(0,pdfTotal-step);pdfPage=Math.max(0,Math.min(lastStart,pdfPage+delta*step));if(directDocument&&pdfFile){redrawPdf();return;}const page=pdfGrid.querySelector('[data-page="'+pdfPage+'"]');if(page)pdfGrid.scrollTo({top:page.offsetTop-pdfGrid.offsetTop,behavior:'smooth'});updatePageButtons()}
$('pdfOverview').onclick=showPdfOverview;$('returnCatalog').onclick=()=>category===null?showFolders():showCategory(category);
function showDocument(id){stopPdfPreviews();imageView?.destroy();imageView=null;directDocument=!webOutput;document.documentElement.classList.toggle('document-output',directDocument);const list=categoryDocs();const position=list.findIndex(d=>d.id===id);if(position<0){if(signage){showFolders()}else if(category!==null){showCategory(category)}else{showFolders()}return}screen='document';index=position;selected=id;const doc=list[index];$('browse').classList.add('hidden');$('detail').classList.remove('hidden');$('viewer-title').hidden=!webOutput;$('viewer-title').textContent=displayTitle(doc);setHeading(displayTitle(doc),category||'Dokumenty školy');pdfGrid=null;pdfFile=null;pdfOverviewSample=[];pdfZoomed=false;pdfViewport.activate(false);pdfTotal=0;pdfPage=0;if(directDocument)document.documentElement.classList.remove('document-ready');updatePageButtons();const viewer=$('viewer');viewer.replaceChildren();const renderId=++pdfRenderId;let el;if(doc.mime==='application/pdf'){showPdfPages(doc,viewer,renderId)}else if(doc.mime?.startsWith('video/')){el=node('video');el.controls=true;el.playsInline=true;el.preload='metadata';el.src=fileUrl(doc);if(signage){el.autoplay=true;el.muted=!videoSound;el.loop=true;el.play().catch(()=>{if(videoSound){el.controls=true;const notice=node('div','muted','Pro přehrávání se zvukem klepněte na video.');viewer.append(notice)}})}}else if(doc.mime?.includes('wordprocessingml')||doc.mime?.includes('presentationml')){el=node('div','office-panel');el.append(node('div','pdf-icon',doc.mime.includes('wordprocessingml')?'WORD':'POWERPOINT'));el.append(node('p','','Tento soubor nelze přímo zobrazit v prohlížeči. Otevřete jej v aplikaci Word nebo PowerPoint.'));const a=node('a','', 'Stáhnout soubor ↗');a.href=fileUrl(doc);a.download=doc.name;a.className='office-download';el.append(a)}else{imageView=window.EduvizeDocumentViewport.mountImage(viewer,fileUrl(doc),{fullscreenTarget:$('detail'),alt:doc.name,onReady:()=>{if(renderId===pdfRenderId)documentReady();},onError:()=>{if(renderId===pdfRenderId)documentReady();}})}if(el){if(el.tagName==='VIDEO'){el.addEventListener('loadeddata',documentReady,{once:true});el.addEventListener('error',()=>{viewer.replaceChildren(node('div','pdf-error','Dokument se nepodařilo načíst.'));documentReady();},{once:true});}else documentReady();viewer.append(el);}$('back').onclick=()=>category===null?showFolders():showCategory(category)}
$('documentsHome').onclick=showFolders;$('back').onclick=()=>screen==='document'&&category!==null?showCategory(category):showFolders();$('prev').onclick=()=>movePages(-1);$('next').onclick=()=>movePages(1);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&directDocument&&pdfZoomed){showPdfOverview();return;}if(e.key==='Escape'&&screen==='document'&&!signage&&!standaloneDocument&&!pdfZoomed)$('returnCatalog').click();if(screen==='document'&&e.key==='ArrowRight')movePages(1);if(screen==='document'&&e.key==='ArrowLeft')movePages(-1)});
async function refresh(){try{const r=await fetch('/api/documents'+(standaloneDocument?'?scope=all':''),{cache:'no-store'});if(!r.ok){let detail='';try{detail=(await r.json()).detail||''}catch{}throw Error(detail||'HTTP '+r.status)}const data=await r.json();docs=Array.isArray(data.items)?data.items:[];if(params.get('document')){const requested=docs.find(d=>d.id===params.get('document'));if(!requested)throw Error('Dokument není dostupný nebo je skrytý');category=null;if(selected!==requested.id||screen!=='document')showDocument(requested.id)}else if(screen==='document'&&docs.some(d=>d.id===selected)){}else if(category!==null&&docs.some(d=>categoryOf(d)===category)){showCategory(category)}else showFolders()}catch(e){$('detail').classList.add('hidden');$('browse').classList.remove('hidden');$('browse').replaceChildren(node('div','error','Dokumenty se nepodařilo načíst: '+e.message));documentReady()}}
let pdfResize=0;window.addEventListener('resize',()=>{if(!directDocument||!pdfFile||!pdfGrid)return;cancelAnimationFrame(pdfResize);pdfResize=requestAnimationFrame(redrawPdf);});
refresh();setInterval(refresh,60000);
</script><script src="https://pborovicka72-dotcom.github.io/eduvize-styly/design-system/segment-display.js?v=20261031-integrity-1"></script></body></html>
