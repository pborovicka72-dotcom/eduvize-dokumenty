<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eduvize – Dokumenty</title>
<style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#153a53;background:#eef5fb}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #13a6bd;outline-offset:3px}.shell{max-width:1550px;margin:auto;padding:clamp(16px,2.5vw,36px)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:16px}.eyebrow{font-size:13px;font-weight:800;letter-spacing:.13em;color:#008d9f}h1{font-size:clamp(28px,3vw,46px);margin:3px 0}h2{font-size:clamp(20px,2vw,30px);margin:0}.subtitle,.muted{color:#607d90}.card{background:#fff;border:1px solid #d9e7ef;border-radius:22px;box-shadow:0 10px 36px #153a5310;padding:clamp(16px,2vw,28px)}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}.pill{background:#e8f6f8;border-radius:999px;color:#007f91;font-size:15px;font-weight:750;padding:8px 16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:18px}.tile{display:flex;flex-direction:column;text-align:left;background:#f7fbfd;border:2px solid #dceaf1;border-radius:19px;overflow:hidden;min-height:250px;transition:transform .15s,border-color .15s,box-shadow .15s}.tile:hover{transform:translateY(-3px);border-color:#11a1b6;box-shadow:0 9px 24px #153a5318}.tile:active{transform:scale(.99)}.folder-tile{padding:24px;min-height:210px;justify-content:space-between;background:linear-gradient(135deg,#edf9fb,#f8fbff)}.folder-icon{width:68px;height:68px;display:grid;place-items:center;background:#d6f1f5;border-radius:18px;color:#00899d}.folder-icon svg{width:38px;height:38px}.tile-title{font-size:clamp(19px,1.7vw,25px);font-weight:780;overflow-wrap:anywhere;line-height:1.2}.tile-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:13px;color:#55788b;font-size:15px}.arrow{font-size:27px;color:#00899d}.thumb{height:190px;width:100%;background:#e7f0f6;display:grid;place-items:center;overflow:hidden;position:relative}.thumb img{width:100%;height:100%;object-fit:contain}.thumb canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;box-shadow:0 2px 12px #153a5320;background:#fff}.thumb .preview-fallback{display:grid;place-items:center;gap:8px;text-align:center;color:#617d90;font-size:13px}.pdf-icon{font-weight:900;color:#bb4652;font-size:29px;background:white;border-radius:12px;padding:19px 13px;box-shadow:0 4px 15px #153a5315}.tile-body{padding:18px;display:flex;flex:1;flex-direction:column;justify-content:space-between}.doc-title{font-size:18px;font-weight:750;line-height:1.35;overflow-wrap:anywhere}.doc-type{font-size:13px;font-weight:700;color:#638396;margin-top:12px}.nav-button{border:0;background:#dff2f6;color:#096579;border-radius:14px;padding:15px 22px;min-height:56px;font-size:18px;font-weight:750}.nav-button:hover{background:#c8eaf0}.viewer-top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:16px}.viewer-title{font-size:clamp(19px,2vw,28px);font-weight:800;overflow-wrap:anywhere}.viewer{background:#f3f7fa;border-radius:15px;min-height:50vh;display:flex;align-items:center;justify-content:center;overflow:hidden}.viewer img{max-width:100%;max-height:72vh;object-fit:contain}.viewer iframe{width:100%;height:72vh;border:0;background:#fff}.pdf-pages{width:100%;height:72vh;overflow:auto;display:grid;grid-template-columns:repeat(var(--pdf-columns,1),minmax(0,1fr));align-content:start;align-items:start;gap:12px;padding:12px}.pdf-page{width:100%;display:block;background:white;box-shadow:0 3px 12px #153a5320}.pdf-error{padding:24px;text-align:center;color:#a22b38}body.signage .pdf-pages{height:calc(100vh - 60px)}.viewer video{max-width:100%;max-height:72vh;width:100%;background:#101820}.office-panel{text-align:center;padding:45px 20px}.office-panel p{font-size:18px;color:#607d90}.office-panel a{display:inline-block;background:#087c91;color:white;border-radius:13px;padding:17px 25px;font-size:19px;font-weight:750;text-decoration:none;margin-top:12px}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px}.controls .nav-button{min-width:145px}.controls .nav-button:disabled{opacity:.35;cursor:default}.empty{text-align:center;padding:65px 20px;color:#617f90;font-size:20px}.error{padding:24px;color:#a22b38;background:#fff2f2;border-radius:12px}.hidden{display:none!important}
body.signage{background:#fff}body.signage .shell{max-width:none;height:100vh;padding:10px;display:flex;flex-direction:column}body.signage header,body.signage .section-heading,body.signage .viewer-top,body.signage .controls{display:none}body.signage .card{flex:1;min-height:0;padding:8px;display:flex;flex-direction:column}body.signage .viewer{flex:1;min-height:0}body.signage .viewer img{max-height:calc(100vh - 60px)}body.signage .viewer iframe{height:calc(100vh - 60px)}html.kiosk-output .shell{max-width:none;min-height:100dvh}html.kiosk-output header{display:none}
@media(max-width:620px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tile{min-height:190px}.folder-tile{padding:16px}.folder-icon{width:50px;height:50px}.folder-icon svg{width:28px;height:28px}.tile-title{font-size:17px}.thumb{height:130px}.tile-body{padding:12px}.doc-title{font-size:15px}.controls .nav-button{min-width:0;flex:1}}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script><style id="eduvize-kiosk-unified-header">html.kiosk-header-synced .shell>header{height:var(--kiosk-header-height)!important;min-height:var(--kiosk-header-height)!important;max-height:var(--kiosk-header-height)!important;box-sizing:border-box!important;overflow:hidden!important;flex:0 0 var(--kiosk-header-height)!important;border-radius:12px!important}html.kiosk-header-synced .shell>header h1{font-size:clamp(15px,2.2vw,28px)!important}html.kiosk-header-synced .shell>header .hero-art{max-height:95%!important}</style><script>window.addEventListener('message',function(event){if(!['https://pborovicka72-dotcom.github.io','https://eduvize-kiosek.onrender.com'].includes(event.origin)||!event.data||event.data.type!=='eduvize-kiosk-layout')return;const h=Number(event.data.headerHeight);if(!Number.isFinite(h)||h<60||h>500)return;document.documentElement.style.setProperty('--kiosk-header-height',Math.round(h)+'px');document.documentElement.classList.add('kiosk-header-synced')});</script><style id="eduvize-kiosk-header-border-v2">html.kiosk-header-synced .shell>header{height:var(--kiosk-header-height)!important;min-height:var(--kiosk-header-height)!important;max-height:var(--kiosk-header-height)!important;flex:0 0 var(--kiosk-header-height)!important;box-sizing:border-box!important;border:2px solid #cfe8f2!important;border-radius:16px!important;overflow:hidden!important;margin-top:0!important;margin-bottom:0!important}</style></head><body><main class="shell"><header><div><div class="eyebrow">EDUVIZE · DOKUMENTY</div><h1>Dokumenty školy</h1><div class="subtitle">Prohlížejte oznámení, soubory a informace školy</div></div></header><section class="card">
<div class="section-heading" id="heading"><h2 id="heading-title">Kategorie dokumentů</h2><span id="heading-count" class="pill"></span></div>
<div id="browse"></div>
<div id="detail" class="hidden"><div class="viewer-top"><button class="nav-button" id="back">← Zpět</button><div class="viewer-title" id="viewer-title"></div></div><div class="viewer" id="viewer"></div><div class="controls" id="controls"><button class="nav-button" id="prev">← Předchozí</button><button class="nav-button" id="next">Další →</button></div></div>
</section></main>
<script>
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);
const signage=params.get('layout')==='signage',kiosk=params.get('viewMode')==='kiosk'||params.get('output')==='kiosk';
if(signage)document.body.classList.add('signage');if(kiosk)document.documentElement.classList.add('kiosk-output');
const seconds=Math.max(3,Math.min(3600,Number(params.get('seconds'))||15));const videoSound=params.get('video_sound')==='on';const pdfColumns=Math.max(1,Math.min(6,parseInt(params.get('pdf_columns')||'1',10)||1));
let docs=[],category=null,selected=null,index=0,pdfPage=0,pdfTotal=0,pdfGrid=null,screen='folders';
const categoryOf=d=>d.category||'Ostatní';const displayTitle=d=>d.title?.trim()||d.name;
const fileUrl=d=>'/api/documents/'+encodeURIComponent(d.id)+'/file';
const folderIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function setHeading(title,count){$('heading-title').textContent=title;$('heading-count').textContent=count}
function categoryDocs(){return category===null?docs:docs.filter(d=>categoryOf(d)===category)}
function showFolders(){screen='folders';category=null;selected=null;$('detail').classList.add('hidden');$('browse').classList.remove('hidden');$('browse').replaceChildren();$('heading').classList.remove('hidden');const cats=[...new Set(docs.map(categoryOf))];setHeading('Kategorie dokumentů',cats.length+' kategorií');if(!cats.length){$('browse').append(node('div','empty','Zatím nejsou zveřejněné žádné dokumenty.'));return}const grid=node('div','grid');for(const name of cats){const count=docs.filter(d=>categoryOf(d)===name).length;const b=node('button','tile folder-tile');b.type='button';const icon=node('span','folder-icon');icon.innerHTML=folderIcon;const title=node('div','tile-title',name);const foot=node('div','tile-foot');foot.append(node('span','',count+' '+(count===1?'dokument':count<5?'dokumenty':'dokumentů')),node('span','arrow','→'));b.append(icon,title,foot);b.onclick=()=>showCategory(name);grid.append(b)}$('browse').append(grid)}
const previewCache=new Map();
async function renderPdfPreview(doc,container){
 const fallback=()=>{container.replaceChildren();const box=node('div','preview-fallback');box.append(node('span','pdf-icon','PDF'),node('span','','Náhled není dostupný'));container.append(box)};
 try{
  if(!window.pdfjsLib){fallback();return}
  window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  let pdf=previewCache.get(doc.id);
  if(!pdf){const response=await fetch(fileUrl(doc));if(!response.ok)throw Error('PDF '+response.status);const bytes=await response.arrayBuffer();pdf=window.pdfjsLib.getDocument({data:bytes}).promise;previewCache.set(doc.id,pdf)}
  const documentPdf=await pdf;const page=await documentPdf.getPage(1);const base=page.getViewport({scale:1});
  const scale=Math.min(420/base.width,300/base.height,2);const viewport=page.getViewport({scale});
  const canvas=document.createElement('canvas');canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);
  const ctx=canvas.getContext('2d');await page.render({canvasContext:ctx,viewport}).promise;
  if(container.isConnected)container.replaceChildren(canvas);
 }catch(e){previewCache.delete(doc.id);if(container.isConnected)fallback()}
}
function thumbnail(doc){const t=node('div','thumb');if(doc.mime&&doc.mime.startsWith('image/')){const img=node('img');img.loading='lazy';img.alt='Náhled: '+doc.name;img.src=fileUrl(doc);img.onerror=()=>{t.replaceChildren(node('span','pdf-icon','OBR'))};t.append(img)}else if(doc.mime==='application/pdf'){t.append(node('span','pdf-icon','PDF'));renderPdfPreview(doc,t)}else if(doc.mime?.startsWith('video/')){t.append(node('span','pdf-icon','▶ VIDEO'))}else if(doc.mime?.includes('wordprocessingml')){t.append(node('span','pdf-icon','WORD'))}else if(doc.mime?.includes('presentationml')){t.append(node('span','pdf-icon','PPTX'))}else{t.append(node('span','pdf-icon','SOUBOR'))}return t}
function showCategory(name){screen='category';category=name;selected=null;$('detail').classList.add('hidden');$('browse').classList.remove('hidden');$('browse').replaceChildren();$('heading').classList.remove('hidden');const list=categoryDocs();const bar=node('div','viewer-top');const back=node('button','nav-button','← Všechny kategorie');back.onclick=showFolders;bar.append(back);$('browse').append(bar);setHeading(name,list.length+' dokumentů');const grid=node('div','grid');for(const d of list){const b=node('button','tile');b.type='button';b.append(thumbnail(d));const body=node('div','tile-body');body.append(node('div','doc-title',displayTitle(d)),node('div','doc-type',d.mime==='application/pdf'?'PDF dokument':d.mime?.startsWith('video/')?'Video':d.mime?.includes('wordprocessingml')?'Word dokument':d.mime?.includes('presentationml')?'PowerPoint prezentace':'Obrázek'));b.append(body);b.onclick=()=>showDocument(d.id);grid.append(b)}$('browse').append(grid)}
let pdfRenderId=0;
async function showPdfPages(doc,viewer,renderId){
 const grid=node('div','pdf-pages');grid.style.setProperty('--pdf-columns',String(pdfColumns));grid.append(node('div','muted','Načítám stránky PDF…'));viewer.append(grid);
 try{
  if(!window.pdfjsLib)throw Error('Knihovna PDF.js není dostupná');
  window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const response=await fetch(fileUrl(doc));if(!response.ok)throw Error('HTTP '+response.status);
  const pdf=await window.pdfjsLib.getDocument({data:await response.arrayBuffer()}).promise;
  if(renderId!==pdfRenderId)return;
  grid.replaceChildren();pdfTotal=pdf.numPages;pdfGrid=grid;pdfPage=0;updatePageButtons();
  const maxWidth=Math.max(120,Math.floor((grid.clientWidth-24-(pdfColumns-1)*12)/pdfColumns));
  for(let n=1;n<=pdf.numPages;n++){
   if(renderId!==pdfRenderId)return;
   const page=await pdf.getPage(n),original=page.getViewport({scale:1});
   const scale=Math.min(2, maxWidth/original.width);
   const viewport=page.getViewport({scale});
   const canvas=node('canvas','pdf-page');canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);
   canvas.setAttribute('aria-label','Stránka '+n+' z '+pdf.numPages);canvas.dataset.page=String(n-1);grid.append(canvas);
   await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;
  }
 }catch(e){if(renderId===pdfRenderId)grid.replaceChildren(node('div','pdf-error','Stránky PDF se nepodařilo zobrazit: '+e.message))}
}
function updatePageButtons(){const pdf=screen==='document'&&categoryDocs().find(d=>d.id===selected)?.mime==='application/pdf';$('prev').disabled=!pdf||pdfPage<=0;$('next').disabled=!pdf||pdfPage+pdfColumns>=pdfTotal;$('controls').classList.toggle('hidden',!pdf)}
function movePages(delta){if(!pdfGrid||!pdfTotal)return;pdfPage=Math.max(0,Math.min(Math.max(0,pdfTotal-pdfColumns),pdfPage+delta*pdfColumns));const page=pdfGrid.querySelector('[data-page="'+pdfPage+'"]');if(page)pdfGrid.scrollTo({top:page.offsetTop-pdfGrid.offsetTop,behavior:'smooth'});updatePageButtons()}
function showDocument(id){const list=categoryDocs();const position=list.findIndex(d=>d.id===id);if(position<0){if(signage){showFolders()}else if(category!==null){showCategory(category)}else{showFolders()}return}screen='document';index=position;selected=id;const doc=list[index];$('browse').classList.add('hidden');$('detail').classList.remove('hidden');$('heading').classList.add('hidden');$('viewer-title').textContent=displayTitle(doc);pdfGrid=null;pdfTotal=0;pdfPage=0;updatePageButtons();const viewer=$('viewer');viewer.replaceChildren();const renderId=++pdfRenderId;let el;if(doc.mime==='application/pdf'){showPdfPages(doc,viewer,renderId)}else if(doc.mime?.startsWith('video/')){el=node('video');el.controls=true;el.playsInline=true;el.preload='metadata';el.src=fileUrl(doc);if(signage){el.autoplay=true;el.muted=!videoSound;el.loop=true;el.play().catch(()=>{if(videoSound){el.controls=true;const notice=node('div','muted','Pro přehrávání se zvukem klepněte na video.');viewer.append(notice)}})}}else if(doc.mime?.includes('wordprocessingml')||doc.mime?.includes('presentationml')){el=node('div','office-panel');el.append(node('div','pdf-icon',doc.mime.includes('wordprocessingml')?'WORD':'POWERPOINT'));el.append(node('p','','Tento soubor nelze přímo zobrazit v prohlížeči. Otevřete jej v aplikaci Word nebo PowerPoint.'));const a=node('a','', 'Stáhnout soubor ↗');a.href=fileUrl(doc);a.download=doc.name;a.className='office-download';a.style.cssText='display:inline-block;background:#087c91;color:white;border-radius:13px;padding:17px 25px;font-size:19px;font-weight:750;text-decoration:none;margin-top:12px';el.append(a)}else{el=node('img');el.alt=doc.name;el.src=fileUrl(doc)}if(el)viewer.append(el);$('back').onclick=()=>category===null?showFolders():showCategory(category)}
$('prev').onclick=()=>movePages(-1);$('next').onclick=()=>movePages(1);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&screen==='document'&&!signage)$('back').click();if(screen==='document'&&e.key==='ArrowRight')movePages(1);if(screen==='document'&&e.key==='ArrowLeft')movePages(-1)});
async function refresh(){try{const r=await fetch('/api/documents',{cache:'no-store'});if(!r.ok){let detail='';try{detail=(await r.json()).detail||''}catch{}throw Error(detail||'HTTP '+r.status)}const data=await r.json();docs=Array.isArray(data.items)?data.items:[];if(signage){category=null;if(docs.length){showDocument(docs.some(d=>d.id===selected)?selected:docs[0].id)}else showFolders()}else if(screen==='document'&&docs.some(d=>d.id===selected)){showDocument(selected)}else if(category!==null&&docs.some(d=>categoryOf(d)===category)){showCategory(category)}else showFolders()}catch(e){$('detail').classList.add('hidden');$('browse').classList.remove('hidden');$('heading').classList.add('hidden');$('browse').replaceChildren(node('div','error','Dokumenty se nepodařilo načíst: '+e.message))}}
refresh();setInterval(()=>{if(signage&&screen==='document'&&pdfTotal)movePages(1)},seconds*1000);setInterval(refresh,60000);
</script></body></html>
