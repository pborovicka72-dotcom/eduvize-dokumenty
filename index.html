<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eduvize – Dokumenty</title><style>:root{font-family:system-ui,Arial;color:#173a52;background:#eef5fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:1500px;margin:auto;padding:clamp(12px,3vw,32px)}header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:16px}.eyebrow{font-size:12px;letter-spacing:.12em;font-weight:800;color:#008f9e}h1{margin:4px 0;font-size:clamp(25px,3vw,43px)}.card{background:white;border:1px solid #d6e6ee;border-radius:18px;padding:20px;box-shadow:0 8px 28px #103c5512}.stage{min-height:60vh;display:grid;place-items:center;overflow:hidden}.stage img{max-width:100%;max-height:75vh;object-fit:contain}.stage iframe{width:100%;height:75vh;border:0}.caption{font-size:clamp(16px,2vw,24px);font-weight:700;margin:10px 0}.muted{color:#607e91}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:14px 0}.toolbar button{background:#e5f0f5;color:#17526b;border:0;border-radius:9px;padding:9px 14px;cursor:pointer}.folders{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;width:100%;align-self:stretch}.folder{padding:24px 16px;background:#e9f4f9;border:1px solid #bcdce7;border-radius:15px;color:#173a52;font-size:clamp(18px,2vw,26px);font-weight:750;cursor:pointer;text-align:left}.folder small{display:block;font-size:13px;font-weight:500;margin-top:8px}.back{background:#e5f0f5;border:0;border-radius:8px;padding:8px 15px;cursor:pointer;margin-bottom:10px}body.signage{background:#fff}body.signage .shell{max-width:none;width:100%;height:100vh;padding:10px;display:flex;flex-direction:column}body.signage header,body.signage .toolbar{display:none}body.signage .card{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px}body.signage .stage{flex:1;min-height:0}body.signage .stage img{max-height:calc(100vh - 90px)}body.signage .stage iframe{height:calc(100vh - 90px)}body.signage .caption{margin:5px 0}</style><style>html.kiosk-output{height:100%}html.kiosk-output body{min-height:100%;margin:0}html.kiosk-output .shell{width:100%!important;max-width:none!important;min-height:100dvh!important;margin:0!important;padding:clamp(8px,1.5vmin,20px)!important}html.kiosk-output .shell>header{display:none!important}html.kiosk-output button{min-height:44px;touch-action:manipulation}</style><script>if(new URLSearchParams(location.search).get('viewMode')==='kiosk'||new URLSearchParams(location.search).get('output')==='kiosk')document.documentElement.classList.add('kiosk-output');</script></head><body><main class="shell"><header><div><div class="eyebrow">EDUVIZE · DOKUMENTY</div><h1>Dokumenty školy</h1></div></header><section class="card"><div id="category" class="muted"></div><div class="stage" id="stage"><p>Načítám dokumenty…</p></div><div id="caption" class="caption"></div></section><div class="toolbar"><span id="count" class="muted"></span><div><button id="prev">Předchozí</button> <button id="next">Další</button></div></div></main><script>
const $=id=>document.getElementById(id),p=new URLSearchParams(location.search);if(p.get('layout')==='signage')document.body.classList.add('signage');const seconds=Math.max(3,Math.min(3600,Number(p.get('seconds'))||15));let docs=[],index=0,activeCategory=null;const automatic=p.get('layout')==='signage'||p.get('viewMode')==='kiosk'||p.get('output')==='kiosk';function show(){const list=activeCategory===null?docs:docs.filter(x=>(x.category||'Ostatní')===activeCategory);const doc=list[index];$('stage').replaceChildren();if(!automatic&&activeCategory===null&&docs.length){const grid=document.createElement('div');grid.className='folders';for(const category of [...new Set(docs.map(x=>x.category||'Ostatní'))]){const button=document.createElement('button');button.className='folder';button.textContent='📁 '+category;const small=document.createElement('small');small.textContent=docs.filter(x=>(x.category||'Ostatní')===category).length+' dokumentů';button.append(small);button.onclick=()=>{activeCategory=category;index=0;show()};grid.append(button)}$('stage').append(grid);$('category').textContent='Vyberte kategorii';$('caption').textContent='';$('count').textContent='';return}if(!doc){$('stage').textContent='Zatím nejsou zveřejněné žádné dokumenty.';$('category').textContent='';$('caption').textContent='';$('count').textContent='';return}if(!automatic){const back=document.createElement('button');back.className='back';back.textContent='← Kategorie';back.onclick=()=>{activeCategory=null;index=0;show()};$('stage').append(back)}const url='/api/documents/'+encodeURIComponent(doc.id)+'/file';let el;if(doc.mime==='application/pdf'){el=document.createElement('iframe');el.title=doc.name;el.src=url+'#toolbar=0&navpanes=0'}else{el=document.createElement('img');el.alt=doc.name;el.src=url}$('stage').append(el);$('category').textContent=doc.category;$('caption').textContent=doc.name;$('count').textContent=(index+1)+' / '+list.length}function next(delta=1){const count=activeCategory===null?docs.length:docs.filter(x=>(x.category||'Ostatní')===activeCategory).length;if(!count||(!automatic&&activeCategory===null))return;index=(index+delta+count)%count;show()}$('prev').onclick=()=>next(-1);$('next').onclick=()=>next(1);async function refresh(){try{const r=await fetch('/api/documents',{cache:'no-store'});if(!r.ok){let detail='';try{const problem=await r.json();detail=typeof problem.detail==='string'?problem.detail:''}catch{}throw Error(detail||'HTTP '+r.status)}const data=await r.json();const id=docs[index]?.id;docs=Array.isArray(data.items)?data.items:[];if(activeCategory!==null&&!docs.some(x=>(x.category||'Ostatní')===activeCategory)){activeCategory=null;index=0}else if(activeCategory!==null){index=Math.max(0,docs.filter(x=>(x.category||'Ostatní')===activeCategory).findIndex(x=>x.id===id))}else{index=Math.max(0,docs.findIndex(x=>x.id===id))}show()}catch(error){$('stage').replaceChildren();const message=document.createElement('p');message.textContent=error.message.includes('OneDrive')?'OneDrive není připojen. Správce musí obnovit připojení v administraci.':'Dokumenty se nepodařilo načíst: '+error.message;$('stage').append(message)}}refresh();setInterval(()=>{if(automatic)next()},seconds*1000);setInterval(refresh,60000);
</script></body></html>
